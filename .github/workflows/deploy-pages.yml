name: GitHub Pages 배포

# docs/ 디렉터리를 GitHub Pages로 배포합니다.
# 사전 조건: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 설정해야 합니다.
# Pages 미설정 시 배포 스텝이 실패해도 워크플로 전체는 실패로 표시되지 않도록 continue-on-error 처리.

on:
  push:
    branches:
      - claude/slack-session-uimf0m
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Pages 설정
        id: setup
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: 아티팩트 업로드 (docs/)
        if: steps.setup.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 배포
        id: deployment
        if: steps.setup.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 안내
        if: steps.setup.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages가 활성화되지 않았습니다. Settings → Pages → Source 를 'GitHub Actions'로 설정하세요."
